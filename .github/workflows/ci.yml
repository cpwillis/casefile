name: ci

# Manual only. casefile is a local tool, so `make check` on your own machine is the real
# gate; this exists to run the same suite on a clean Linux box when you want a second
# opinion, not to gate every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
