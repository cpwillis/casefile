[project]
name = "casefile"
version = "0.1.0"
description = "One input box, every relevant OSINT pivot. Runs locally."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "cpwillis" }]
keywords = ["osint", "investigation", "recon", "intelligence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "starlette>=0.41",
  "uvicorn>=0.32",
  "jinja2>=3.1",
]

[project.urls]
Homepage = "https://casefile.cpwillis.dev"
Source = "https://github.com/cpwillis/casefile"

[project.scripts]
casefile = "casefile.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casefile"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live"]
markers = [
  "live: hits real third-party services. Excluded by default; run with `make live`.",
]
