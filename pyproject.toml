[project]
name = "casefile"
version = "0.0.0"
description = "One input box, every relevant OSINT pivot. Runs locally."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "cpwillis" }]
keywords = ["osint", "investigation", "recon", "intelligence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "typer>=0.15",
  "phonenumbers>=8.13",
]

[project.urls]
Homepage = "https://osint.cpwillis.com"
Source = "https://github.com/cpwillis/osint"

[project.scripts]
casefile = "casefile.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "respx>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casefile"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
