[project]
name = "casefile"
dynamic = ["version"]  # read from src/casefile/__init__.py, one place to bump
description = "One input box, every relevant OSINT pivot. Runs locally."
readme = "README.md"
requires-python = ">=3.11"  # tomllib, StrEnum and asyncio.timeout; the suite runs on 3.11, 3.12 and 3.13
license = "MIT"
authors = [{ name = "cpwillis" }]
keywords = ["osint", "investigation", "recon", "intelligence"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.28",
  "starlette>=0.41",  # each floor is the oldest the suite passes against, so an old system install still works
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "phonenumbers>=9.0",
  "idna>=3.10",
]

[project.urls]
Homepage = "https://casefile.cpwillis.dev"
Source = "https://github.com/cpwillis/casefile"

[project.scripts]
casefile = "casefile.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/casefile/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["docs"]  # design and plan docs are internal, not part of the distribution

[tool.hatch.build.targets.wheel]
packages = ["src/casefile"]

[tool.ruff]
line-length = 120
exclude = ["docs/**", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live"]
asyncio_mode = "auto"
markers = [
  "live: hits real third-party services. Excluded by default; run with `make live`.",
]
