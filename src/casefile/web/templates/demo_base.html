<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}casefile demo{% endblock %}</title>
<link rel="stylesheet" href="static/casefile.css">
</head>
<body>
<a class="skip" href="#pane">Skip to results</a>
<header class="topbar">
  <form class="search" role="search" onsubmit="return false;">
    <label class="visually-hidden" for="target">Identifier to look up</label>
    <input id="target" type="search" value="{{ raw | default('') }}"
           placeholder="this demo cannot search, run casefile locally" disabled>
    <button type="button" disabled>Search</button>
  </form>
</header>
<div class="demo-banner">
  This is a static demo of <strong>casefile</strong>, rendered from the real application against
  canned data. It cannot look anything up. To actually use it:
  <code>uvx casefile</code>
  <a href="https://github.com/cpwillis/casefile" rel="noreferrer noopener">source</a>
</div>
{% block content %}{% endblock %}
</body>
</html>
