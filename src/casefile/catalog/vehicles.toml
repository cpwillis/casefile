# src/casefile/catalog/vehicles.toml
# Vehicle VIN and MAC/OUI lookups.

[[source]]
id = "nhtsa-vpic-decode-vin"
name = "NHTSA vPIC VIN Decoder"
accepts = ["vin"]
url = "https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVin/{value}?format=json"
notes = "Free US government VIN decoder API; VIN in path, returns nested JSON of make/model/year/specs. Verified live."
provenance = "NHTSA vPIC public government API"

[[source]]
id = "nhtsa-vpic-decode-vin-values"
name = "NHTSA vPIC VIN Decoder (flat)"
accepts = ["vin"]
url = "https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/{value}?format=json"
notes = "Same vPIC decoder, flat single-object JSON output. Verified live."
provenance = "NHTSA vPIC public government API"

[[source]]
id = "vindecoder-eu"
name = "vindecoder.eu VIN Check"
accepts = ["vin"]
url = "https://www.vindecoder.eu/check-vin/{value}"
notes = "VIN embedded in path. Result page may gate behind a captcha but URL shape is stable and verified."
provenance = "Well-known public VIN decoder"

[[source]]
id = "vindecoderz"
name = "Vindecoderz VIN Lookup"
accepts = ["vin"]
url = "https://www.vindecoderz.com/EN/check-lookup/{value}"
notes = "Free VIN lookup; VIN in path under /EN/check-lookup/. Bot-blocks automated fetches but publicly viewable in a browser."
provenance = "Well-known public VIN decoder"

[[source]]
id = "macvendors-api"
name = "macvendors.com API"
accepts = ["mac"]
url = "https://api.macvendors.com/{value}"
notes = "Returns plain-text vendor for a MAC/OUI prefix. Accepts colon/hyphen separators. Verified live (Cisco)."
provenance = "awesome-osint"

[[source]]
id = "macvendors-query"
name = "macvendors.com Lookup"
accepts = ["mac"]
url = "https://macvendors.com/query/{value}"
notes = "Browser-facing vendor lookup page; MAC in path. Verified returns vendor."
provenance = "awesome-osint"

[[source]]
id = "maclookup-app"
name = "maclookup.app MAC Search"
accepts = ["mac"]
url = "https://maclookup.app/search/result?mac={value}"
notes = "Vendor, block type, registration details. MAC in ?mac= query. Verified live (Cisco)."
provenance = "Well-known MAC/OUI vendor lookup"

[[source]]
id = "macvendorlookup-api"
name = "macvendorlookup.com API"
accepts = ["mac"]
url = "https://www.macvendorlookup.com/api/v2/{value}"
notes = "Returns vendor name and registered address JSON; MAC in path. Verified live (Cisco)."
provenance = "Well-known MAC vendor lookup"

[[source]]
id = "aruljohn-mac"
name = "aruljohn MAC Lookup"
accepts = ["mac"]
url = "https://aruljohn.com/mac/{value}"
notes = "Vendor and OUI block range; MAC in path (accepts with or without separators). Verified live (Cisco)."
provenance = "Well-known MAC/OUI lookup"

