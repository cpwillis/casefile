# src/casefile/catalog/maritime.toml
# Vessel tracking and ship registries.

[[source]]
id = "marinetraffic-mmsi"
name = "MarineTraffic (MMSI)"
accepts = ["mmsi"]
url = "https://www.marinetraffic.com/en/ais/details/ships/mmsi:{value}"
notes = "Redirects to the live AIS vessel details page for the given MMSI. Publicly viewable."
provenance = "awesome-osint"

[[source]]
id = "marinetraffic-imo"
name = "MarineTraffic (IMO)"
accepts = ["imo"]
url = "https://www.marinetraffic.com/en/ais/details/ships/imo:{value}"
notes = "Redirects to the live AIS vessel details page for the given IMO number. Publicly viewable."
provenance = "awesome-osint"

[[source]]
id = "vesselfinder-mmsi"
name = "VesselFinder (MMSI)"
accepts = ["mmsi"]
url = "https://www.vesselfinder.com/?mmsi={value}"
notes = "Homepage map resolves directly to the vessel matching the MMSI. Bellingcat toolkit source."
provenance = "awesome-osint"

[[source]]
id = "vesselfinder-imo"
name = "VesselFinder (IMO)"
accepts = ["imo"]
url = "https://www.vesselfinder.com/?imo={value}"
notes = "Confirmed: ?imo= resolves to the specific vessel details page (IMO overrides MMSI). Bellingcat toolkit source."
provenance = "awesome-osint"

[[source]]
id = "myshiptracking-search"
name = "MyShipTracking (search)"
accepts = ["mmsi", "imo"]
url = "https://www.myshiptracking.com/vessels?search={value}"
notes = "Single search endpoint accepts MMSI, IMO or name; ?search= confirmed. Returns matching vessels list."
provenance = "awesome-osint"

[[source]]
id = "balticshipping-imo"
