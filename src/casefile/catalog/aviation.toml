# src/casefile/catalog/aviation.toml
# Aircraft tracking and registries.

[[source]]
id = "adsbexchange-globe-icao"
name = "ADS-B Exchange (Globe, by ICAO24)"
accepts = ["icao24"]
url = "https://globe.adsbexchange.com/?icao={value}"
notes = "tar1090 globe; ?icao= selects the aircraft by Mode-S hex, case-insensitive."
provenance = "awesome-osint"

[[source]]
id = "adsbexchange-globe-reg"
name = "ADS-B Exchange (Globe, by registration)"
accepts = ["tail_number"]
url = "https://globe.adsbexchange.com/?reg={value}"
notes = "tar1090 ?reg= direct link by registration; loads slower than ?icao=."
provenance = "awesome-osint"

