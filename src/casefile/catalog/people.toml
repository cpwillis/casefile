# src/casefile/catalog/people.toml
# People and email search.

[[source]]
id = "haveibeenpwned-email"
name = "Have I Been Pwned"
accepts = ["email"]
url = "https://haveibeenpwned.com/account/{value}"
notes = "Breach exposure for an email; results page may require owner verification but the link is stable."
provenance = "awesome-osint"

[[source]]
id = "emailrep-email"
name = "EmailRep"
accepts = ["email"]
url = "https://emailrep.io/{value}"
notes = "Reputation, deliverability and profile signals for an email; returns JSON in-browser."
provenance = "known email reputation service"

[[source]]
id = "hunter-email-verifier"
name = "Hunter Email Verifier"
accepts = ["email"]
url = "https://hunter.io/email-verifier/{value}"
notes = "Validity and source-of-discovery for a single email."
provenance = "awesome-osint"

[[source]]
id = "hunter-domain-search"
name = "Hunter Domain Search"
accepts = ["domain"]
url = "https://hunter.io/search/{value}"
notes = "Known email addresses and patterns for a domain."
provenance = "awesome-osint"

[[source]]
id = "epieos-email"
name = "Epieos"
accepts = ["email"]
url = "https://epieos.com/?q={value}"
notes = "Account/service enumeration and Google profile pivots for an email."
provenance = "awesome-osint"

[[source]]
id = "dehashed-search"
name = "DeHashed"
accepts = ["email", "person", "phone", "domain", "ip"]
url = "https://dehashed.com/search?query={value}"
notes = "Breach-credential search; account required to view results."
provenance = "awesome-osint"

[[source]]
id = "thatsthem-email"
name = "ThatsThem Reverse Email"
accepts = ["email"]
url = "https://thatsthem.com/email/{value}"
notes = "Reverse email to name/address/phone."
provenance = "known US people-search service"

[[source]]
id = "openpgp-keyserver"
name = "keys.openpgp.org"
accepts = ["email"]
url = "https://keys.openpgp.org/search?q={value}"
notes = "Verified PGP keys bound to an email."
provenance = "public PGP key directory"

[[source]]
id = "ubuntu-keyserver"
name = "Ubuntu PGP Keyserver"
accepts = ["email"]
url = "https://keyserver.ubuntu.com/pks/lookup?search={value}&op=index"
notes = "PGP key index by email/user id."
provenance = "public SKS-style keyserver"

[[source]]
id = "psbdmp-search"
name = "psbdmp Paste Dump"
accepts = ["email", "domain"]
url = "https://psbdmp.ws/search/{value}"
